name: Build AVYGRAM APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Official Gradle Wrapper Jar
      run: |
        curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/nicokosi/empty-gradle-project/master/gradle/wrapper/gradle-wrapper.jar
        curl -s -L -o gradlew https://raw.githubusercontent.com/nicokosi/empty-gradle-project/master/gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
