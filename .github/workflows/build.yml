name: Build AVYGRAM APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon 2>&1 | tee build_full.log || true
        if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
          echo "==================== MANA ASIL XATO ===================="
          grep -E "e: |error:|FAILURE:" -A 3 build_full.log || tail -n 60 build_full.log
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
