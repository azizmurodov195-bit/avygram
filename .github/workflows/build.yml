name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Environment
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    - name: Prepare FFmpeg and Native Dependencies
      run: |
        chmod +x gradlew
        # FFmpeg va prebuilt kutubxonalarni yuklash/tayyorlash
        if [ -f "./TMessagesProj/jni/ffmpeg/download.sh" ]; then
          bash ./TMessagesProj/jni/ffmpeg/download.sh || true
        fi
        ./gradlew getFFmpeg || true

    - name: Build APK
      run: |
        ./gradlew assembleAfatDebug --no-daemon -x test -x lint

    - name: Upload AVYGRAM APK
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: error
