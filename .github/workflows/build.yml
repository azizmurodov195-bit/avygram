name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Native Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake yasm nasm golang

    - name: Strip 32-bit ABIs Everywhere & Build Arm64 Native Libs
      run: |
        # Barcha build.gradle fayllardan armeabi-v7a, x86 va x86_64 ni olib tashlash
        find . -name "build.gradle" -exec sed -i 's/"armeabi-v7a"//g; s/"x86_64"//g; s/"x86"//g' {} +
        find . -name "build.gradle" -exec sed -i "s/'armeabi-v7a'//g; s/'x86_64'//g; s/'x86'//g" {} +
        # Bo'sh qolgan vergullarni tozalash (masalan: abiFilters , , "arm64-v8a" -> abiFilters "arm64-v8a")
        find . -name "build.gradle" -exec sed -i -E 's/abiFilters[[:space:]]*,+/abiFilters /g; s/,[[:space:]]*,/,/g; s/,[[:space:]]*$//g' {} +
        
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
        if [ ! -d "$ANDROID_NDK_HOME" ]; then
          export ANDROID_NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d | tail -n 1)
        fi
        export NDK="$ANDROID_NDK_HOME"
        
        cd TMessagesProj/jni
        if [ -f "build_boringssl.sh" ]; then
          chmod +x build_boringssl.sh
          ./build_boringssl.sh arm64-v8a
        fi
        if [ -f "build_ffmpeg_clang.sh" ]; then
          chmod +x build_ffmpeg_clang.sh
          ./build_ffmpeg_clang.sh arm64-v8a
        fi
        cd ../..

    - name: Build AVYGRAM APK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        chmod +x gradlew
        ./gradlew assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a -x test -x lint --no-daemon

    - name: Upload AVYGRAM APK
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: error
