name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install exact NDK
      run: |
        export SKIP_JDK_VERSION_CHECK=true
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"

    - name: Configure Environment
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleAfatDebug -x lint -x test --no-daemon || ./gradlew assembleDebug -x lint -x test --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-Telegram-APK
        path: "**/build/outputs/apk/**/*.apk"
