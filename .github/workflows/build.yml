name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Preinstalled NDK & Properties
      run: |
        # Mavjud NDK ni topish yoki bog'lash
        NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -name "21.*" | head -n 1)
        if [ -z "$NDK_PATH" ]; then
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d | tail -n 1)
        fi
        echo "Topilgan NDK: $NDK_PATH"
        
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$NDK_PATH" >> local.properties

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleAfatDebug -x lint -x test --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-Telegram-APK
        path: "**/build/outputs/apk/**/*.apk"
