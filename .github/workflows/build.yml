name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Environment
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleAfatDebug --no-daemon --console=plain > build.log 2>&1 || true
        echo "=== XATOLIKNING ASOSIY SABABI ==="
        grep -E -C 3 "error:|FAILURE:|FAILED|What went wrong" build.log | head -n 40
        find . -name "*.apk"

    - name: Upload AVYGRAM APK
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: ignore
