name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup NDK and Local Properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleAfatDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt || (echo "=== XATOLIK MATNI ===" && grep -B 2 -A 10 "FAILURE: Build failed" build_log.txt && exit 1)

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-Telegram-APK
        path: "**/build/outputs/apk/**/*.apk"
