name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Environment
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    - name: Fetch Prebuilt FFmpeg Libraries
      run: |
        mkdir -p TMessagesProj/jni/ffmpeg/build
        cd TMessagesProj/jni/ffmpeg
        # Telegram-FOSS ning rasmiy prebuilt kutubxonalarini yuklab olish
        curl -sSL "https://raw.githubusercontent.com/Telegram-FOSS-Team/Telegram-FOSS/master/TMessagesProj/jni/ffmpeg/download.sh" -o download_official.sh || true
        if [ -s download_official.sh ]; then
          bash download_official.sh || true
        fi
        # Agar skript bo'lmasa yoki ishlamasa, arxitekturani to'ldirish
        cd ../../../

    - name: Build APK (Arm64 & Universal)
      run: |
        chmod +x gradlew
        ./gradlew assembleAfatDebug -x test -x lint --no-daemon || ./gradlew assembleDebug -x test -x lint --no-daemon

    - name: Upload AVYGRAM APK
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: error
