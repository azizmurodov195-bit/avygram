name: Build AVYGRAM APK

on:
  push:
    branches: [ avy-release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Environment
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    - name: Build FFmpeg & Arm64 APK
      run: |
        chmod +x gradlew
        # Agar ffmpeg skripti bo'lsa arm64 uchun ishga tushirish
        if [ -f "./TMessagesProj/jni/build_ffmpeg_clang.sh" ]; then
          cd TMessagesProj/jni && bash build_ffmpeg_clang.sh arm64-v8a && cd ../..
        fi
        ./gradlew assembleArm64Debug -x test -x lint --no-daemon || ./gradlew assembleDebug -PabiList=arm64-v8a -x test -x lint --no-daemon

    - name: Collect APK
      run: |
        mkdir -p ready_apk
        find . -name "*.apk" -exec cp {} ready_apk/ \;
        ls -la ready_apk/

    - name: Upload AVYGRAM APK
      uses: actions/upload-artifact@v4
      with:
        name: AVYGRAM-APK
        path: ready_apk/*.apk
        if-no-files-found: error
